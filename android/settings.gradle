pluginManagement {
  includeBuild(new File(rootDir, "../node_modules/@react-native/gradle-plugin"))
  includeBuild(
    new File(
      ["node",
       "--print",
       "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })"
      ].execute(null, rootDir).text.trim()
    ).parentFile.toString()
  )
}
plugins {
  id 'com.facebook.react.settings'
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
  if (System.getenv('EXPO_USE_COMMUNITY_AUTOLINKING') == '1') {
    ex.autolinkLibrariesFromCommand()
  } else {
    def command = [
      'node',
      '--no-warnings',
      '--eval',
      "require(require.resolve('expo-modules-autolinking',{ paths:[require.resolve('expo/package.json')] }))(process.argv.slice(1))",
      'react-native-config',
      '--json',
      '--platform',
      'android'
    ]
    ex.autolinkLibrariesFromCommand(command)
  }
}

rootProject.name = 'co-stream'

dependencyResolutionManagement {
  versionCatalogs {
    reactAndroidLibs {
      from(files(new File(rootDir, "../node_modules/react-native/gradle/libs.versions.toml")))
    }
  }
}

apply from: new File(["node","--print","require.resolve('expo/package.json')"].execute(null, rootDir).text.trim(), "../scripts/autolinking.gradle")

useExpoModules()

include ':app'
includeBuild("../node_modules/@react-native/gradle-plugin")
apply from: file("../node_modules/@notifee/react-native/android/settings.gradle")